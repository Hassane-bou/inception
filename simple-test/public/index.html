<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نموذج التسجيل - اختبار MongoDB</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 320px;
    }
    h1 {
      text-align: center;
      font-size: 20px;
      color: #333;
    }
    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      color: #555;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    .link {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #4285F4;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📝 نموذج تسجيل مستخدم جديد</h1>
    <form action="/register" method="POST">
      <label for="name">الاسم الكامل</label>
      <input type="text" id="name" name="name" placeholder="مثال: Hassane" required>

      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" name="email" placeholder="example@mail.com" required>

      <label for="password">كلمة المرور</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>

      <button type="submit">تسجيل</button>
    </form>
    <a class="link" href="/users">👁 عرض كل المستخدمين المسجَّلين</a>
  </div>
</body>
</html>
